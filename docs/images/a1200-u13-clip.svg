<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="20" y="28" font-size="17" fill="#222" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">No CN17: take the same signals from U13 with a PLCC clip or piggyback</text>
<rect x="40" y="55" width="210" height="216" rx="6" fill="#fff" stroke="#d9534f" stroke-width="2.5"/>
<text x="145.0" y="76" font-size="14" fill="#d9534f" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A1200 U13 (68HC05)</text>
<circle cx="250" cy="95" r="5" fill="#d9534f"/>
<text x="238" y="99" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">pin 13 (PB0) KB_DATA</text>
<circle cx="250" cy="121" r="5" fill="#d9534f"/>
<text x="238" y="125" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">pin 14 (PB1) KB_CLOCK</text>
<circle cx="250" cy="147" r="5" fill="#d9534f"/>
<text x="238" y="151" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">pin 38 (TCMP) KB_RESET</text>
<circle cx="250" cy="173" r="5" fill="#d9534f"/>
<text x="238" y="177" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">pin 1 (/RESET)</text>
<circle cx="250" cy="199" r="5" fill="#d9534f"/>
<text x="238" y="203" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif"></text>
<circle cx="250" cy="225" r="5" fill="#d9534f"/>
<text x="238" y="229" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">pin 44 (VDD)</text>
<circle cx="250" cy="251" r="5" fill="#d9534f"/>
<text x="238" y="255" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">pin 22 (VSS)</text>
<rect x="620" y="55" width="150" height="216" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="695.0" y="76" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">din5 J1</text>
<circle cx="620" cy="95" r="5" fill="#2e7d32"/>
<text x="632" y="99" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">KDAT  1</text>
<circle cx="620" cy="121" r="5" fill="#2e7d32"/>
<text x="632" y="125" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">KCLK  2</text>
<circle cx="620" cy="147" r="5" fill="#2e7d32"/>
<text x="632" y="151" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">KB_RESET out  3</text>
<circle cx="620" cy="173" r="5" fill="#2e7d32"/>
<text x="632" y="177" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">to JP1 (GND)  4</text>
<circle cx="620" cy="199" r="5" fill="#2e7d32"/>
<text x="632" y="203" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">NC  5</text>
<circle cx="620" cy="225" r="5" fill="#2e7d32"/>
<text x="632" y="229" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">VCC in  6</text>
<circle cx="620" cy="251" r="5" fill="#2e7d32"/>
<text x="632" y="255" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GND  7</text>
<line x1="250" y1="95" x2="620" y2="95" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="121" x2="620" y2="121" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="147" x2="620" y2="147" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="173" x2="620" y2="173" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="225" x2="620" y2="225" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="251" x2="620" y2="251" stroke="#333" stroke-width="2.5"/>
<text x="450" y="285" font-size="13" fill="#222" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Wire the clip to a 1x7 header in CN17 order, so the din5 board plugs straight in.</text>
<text x="450" y="315" font-size="12.5" fill="#d9534f" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Pin numbers are from the A1200 schematic (sheet 9). Check them against your clip before powering up.</text>
<text x="450" y="334" font-size="12.5" fill="#666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The din5 board then plugs in exactly as it would on CN17, and its JP1 holds U13 in reset through pin 1.</text>
<text x="450" y="353" font-size="12.5" fill="#666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Nothing is soldered to the A1200; remove the clip to put it back as it was.</text>
</svg>
