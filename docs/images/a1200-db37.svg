<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="20" y="28" font-size="17" fill="#222" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A1200 side of the DB37 adapter: nothing is soldered to the A1200</text>
<rect x="20" y="50" width="230" height="90" rx="8" fill="#fff" stroke="#d9534f" stroke-width="2.5"/>
<text x="135.0" y="72" font-size="15" fill="#d9534f" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A1200 CN13</text>
<text x="135.0" y="92" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">keyboard ribbon socket</text>
<text x="135.0" y="109" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">(where the keyboard tail went)</text>
<rect x="620" y="50" width="260" height="90" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="750.0" y="72" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Adapter J1</text>
<text x="750.0" y="92" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Molex 52044 FFC socket</text>
<text x="750.0" y="109" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">same as the A1200KBv2</text>
<line x1="250" y1="95" x2="620" y2="95" stroke="#333" stroke-width="3"/>
<text x="435.0" y="85" font-size="12" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">31-way 1.25mm FFC (as used for the A1200KBv2)</text>
<rect x="100" y="175" width="150" height="164" rx="6" fill="#fff" stroke="#d9534f" stroke-width="2.5"/>
<text x="175.0" y="196" font-size="14" fill="#d9534f" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A1200 CN14</text>
<circle cx="250" cy="215" r="5" fill="#d9534f"/>
<text x="238" y="219" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">1  PWR LED</text>
<circle cx="250" cy="241" r="5" fill="#d9534f"/>
<text x="238" y="245" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">2  FLOPPY LED</text>
<circle cx="250" cy="267" r="5" fill="#d9534f"/>
<text x="238" y="271" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">3  IDE LED</text>
<circle cx="250" cy="293" r="5" fill="#d9534f"/>
<text x="238" y="297" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">4  CC (unused)</text>
<circle cx="250" cy="319" r="5" fill="#d9534f"/>
<text x="238" y="323" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">5  GND</text>
<rect x="620" y="175" width="150" height="164" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="695.0" y="196" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Adapter J2</text>
<circle cx="620" cy="215" r="5" fill="#2e7d32"/>
<text x="632" y="219" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GND  1</text>
<circle cx="620" cy="241" r="5" fill="#2e7d32"/>
<text x="632" y="245" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PWR  2</text>
<circle cx="620" cy="267" r="5" fill="#2e7d32"/>
<text x="632" y="271" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">FLOPPY  3</text>
<circle cx="620" cy="293" r="5" fill="#2e7d32"/>
<text x="632" y="297" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">DISK  4</text>
<circle cx="620" cy="319" r="5" fill="#2e7d32"/>
<text x="632" y="323" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GND (spare)  5</text>
<line x1="250" y1="215" x2="620" y2="241" stroke="#c77700" stroke-width="2.5"/>
<line x1="250" y1="241" x2="620" y2="267" stroke="#c77700" stroke-width="2.5"/>
<line x1="250" y1="267" x2="620" y2="293" stroke="#c77700" stroke-width="2.5"/>
<line x1="250" y1="319" x2="620" y2="215" stroke="#c77700" stroke-width="2.5"/>
<text x="450" y="405" font-size="13" fill="#d9534f" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">NOT a straight cable: CN14 pin 1 is driven from VCC and J2 pin 1 is GND.</text>
<text x="450" y="423" font-size="12.5" fill="#666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">J2 is also the adapter's only ground, so it must be wired even if you don't want LEDs.</text>
</svg>
