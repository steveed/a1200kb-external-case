<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="20" y="28" font-size="17" fill="#222" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Keyboard side: A1200KBv2 to the DB37 adapter or the encoder (the same on both)</text>
<rect x="20" y="50" width="230" height="90" rx="8" fill="#fff" stroke="#1565c0" stroke-width="2.5"/>
<text x="135.0" y="72" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A1200KBv2 J1</text>
<text x="135.0" y="92" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Molex 52044 FFC socket</text>
<text x="135.0" y="109" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">(underside, rear)</text>
<rect x="620" y="50" width="260" height="90" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="750.0" y="72" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Board J1</text>
<text x="750.0" y="92" font-size="12.5" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Molex 52044 FFC socket</text>
<line x1="250" y1="95" x2="620" y2="95" stroke="#333" stroke-width="3"/>
<text x="435.0" y="85" font-size="12" fill="#333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">31-way 1.25mm FFC</text>
<rect x="100" y="160" width="150" height="138" rx="6" fill="#fff" stroke="#1565c0" stroke-width="2.5"/>
<text x="175.0" y="181" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A1200KBv2 J2</text>
<circle cx="250" cy="200" r="5" fill="#1565c0"/>
<text x="238" y="204" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">1  LED GND</text>
<circle cx="250" cy="226" r="5" fill="#1565c0"/>
<text x="238" y="230" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">2  PWR</text>
<circle cx="250" cy="252" r="5" fill="#1565c0"/>
<text x="238" y="256" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">3  FLOPPY</text>
<circle cx="250" cy="278" r="5" fill="#1565c0"/>
<text x="238" y="282" font-size="12.5" fill="#333" text-anchor="end" font-family="Helvetica, Arial, sans-serif">4  DISK</text>
<rect x="620" y="160" width="150" height="164" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="695.0" y="181" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Board J2</text>
<circle cx="620" cy="200" r="5" fill="#2e7d32"/>
<text x="632" y="204" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GND  1</text>
<circle cx="620" cy="226" r="5" fill="#2e7d32"/>
<text x="632" y="230" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PWR  2</text>
<circle cx="620" cy="252" r="5" fill="#2e7d32"/>
<text x="632" y="256" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">FLOPPY  3</text>
<circle cx="620" cy="278" r="5" fill="#2e7d32"/>
<text x="632" y="282" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">DISK  4</text>
<circle cx="620" cy="304" r="5" fill="#2e7d32"/>
<text x="632" y="308" font-size="12.5" fill="#333" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GND (spare)  5</text>
<line x1="250" y1="200" x2="620" y2="200" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="226" x2="620" y2="226" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="252" x2="620" y2="252" stroke="#333" stroke-width="2.5"/>
<line x1="250" y1="278" x2="620" y2="278" stroke="#333" stroke-width="2.5"/>
<text x="450" y="300" font-size="12.5" fill="#666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Straight 4-way cable to J2 pins 1-4. A reversed plug at the board end only swaps PWR and DISK.</text>
<text x="450" y="318" font-size="12.5" fill="#d9534f" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">The keyboard FFC has no ground: the LED cable is the keyboard's only ground, so always fit it.</text>
</svg>
